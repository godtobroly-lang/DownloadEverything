<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DownloadEverything</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="header">
    <div class="logo">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/>
        <line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      DownloadEverything
    </div>
    <button id="btn-refresh" class="icon-btn" title="Actualiser">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polyline points="23 4 23 10 17 10"/>
        <path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
      </svg>
    </button>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="images">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <rect x="3" y="3" width="18" height="18" rx="2"/>
        <circle cx="8.5" cy="8.5" r="1.5"/>
        <polyline points="21 15 16 10 5 21"/>
      </svg>
      Images <span id="count-images" class="badge">0</span>
    </button>
    <button class="tab" data-tab="videos">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <polygon points="23 7 16 12 23 17 23 7"/>
        <rect x="1" y="5" width="15" height="14" rx="2"/>
      </svg>
      Vidéos <span id="count-videos" class="badge">0</span>
    </button>
  </div>

  <div class="toolbar">
    <label class="select-all-label">
      <input type="checkbox" id="chk-select-all" />
      Tout sélectionner
    </label>
    <div class="toolbar-actions">
      <select id="min-size-filter" title="Taille minimale">
        <option value="0">Toutes tailles</option>
        <option value="50">≥ 50px</option>
        <option value="100">≥ 100px</option>
        <option value="200">≥ 200px</option>
        <option value="500">≥ 500px</option>
      </select>
      <button id="btn-download-selected" class="btn-primary" disabled>
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Télécharger (<span id="selected-count">0</span>)
      </button>
    </div>
  </div>

  <div id="media-list" class="media-list">
    <div class="loading">
      <div class="spinner"></div>
      Analyse de la page…
    </div>
  </div>

  <div id="toast" class="toast hidden"></div>

  <script src="popup.js"></script>
</body>
</html>
